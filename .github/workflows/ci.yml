name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run test suite with coverage
        run: |
          pytest --cov=dockerfile_doctor --cov-report=term-missing --cov-fail-under=90

      - name: Run CLI smoke tests
        run: |
          dockerfile-doctor --version
          dockerfile-doctor --help
          printf "FROM python:3.11-slim\nUSER 10001\n" | dockerfile-doctor lint -
          echo "FROM python:3.11-slim" | dockerfile-doctor lint --fail-on error -
          echo "FROM python:3.11-slim" | dockerfile-doctor fix -
          printf "FROM alpine:3.19\nUSER 10001\n" | dockerfile-doctor scan -
